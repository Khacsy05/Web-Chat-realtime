version: '3.8'

services:
  # 1. Cấu hình dịch vụ Backend (Node.js)
  backend:
    build: ../backend
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      # QUAN TRỌNG: Đổi localhost thành 'database' để kết nối nội bộ giữa các container
      - MONGO_URI=mongodb+srv://khacsy0:khacsy@chatrealtime.yl0la9b.mongodb.net/ChatRealTime?retryWrites=true&w=majority

  # 2. Cấu hình dịch vụ Frontend (React)
  frontend:
    build: ../frontend
    container_name: mern-frontend
    ports:
      - "5173:5173"
    stdin_open: true # Giữ terminal mở để React không bị tự động tắt
    depends_on:
      - backend
